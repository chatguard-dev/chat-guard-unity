    url: https://chatguard.dev/discord
    about: "Ask in the #help forum on the Chat Guard Discord."
  - name: Account and billing
    url: https://chatguard.dev/terms#6-availability-and-support
    about: "Email support@chatguard.dev: your organization, subscription or sign-in. Never email player ids or players' messages."
  - name: Plans and custom volume
    url: https://chatguard.dev/#pricing
    about: "Email sales@chatguard.dev: questions before you buy, Enterprise and custom volume."
